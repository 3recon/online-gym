# Cloudflare Worker 설정 — 하루 한 번 Supabase를 깨우는 일만 함
# 사이트는 Cloudflare Pages(online-gym.pages.dev)가 public 폴더로 올림
# 둘 다 GitHub 저장소에 연결돼 있어서 main에 푸시하면 각각 자동 배포됨
name = "online-gym"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = false    # 주소 없이 예약 작업만 (예전 online-gym.jch200325.workers.dev 끔)
preview_urls = false

[triggers]
# 매일 03:00 (한국 시간). Cron은 UTC 기준이라 18:00
crons = ["0 18 * * *"]

[vars]
# public/config.js에 넣는 값과 똑같이. anon 키는 원래 공개용이라 여기 적어도 됨
SUPABASE_URL = "https://ijmzzzmyokvpgfberxbx.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_5JamHpc19YlFHi13o3t8PQ_pe9mt_iZ"
