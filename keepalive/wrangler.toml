# Supabase 깨우기용 Cloudflare Worker
# 배포: 이 폴더에서 `npx wrangler login` 한 번 → `npx wrangler deploy`
name = "online-gym-keepalive"
main = "worker.js"
compatibility_date = "2025-09-01"

[triggers]
# 매일 03:00 (한국 시간). Cron은 UTC 기준이라 18:00
crons = ["0 18 * * *"]

[vars]
# public/config.js에 넣은 값과 똑같이. anon 키는 공개용이라 여기 적어도 됨
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
