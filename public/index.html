<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>온라인 헬스장</title>
  <meta name="description" content="회사에서 매일 치는 문장을 따라 치면 바벨이 올라가요. 옆에서 보면 그냥 일하는 중. 부장님 오면 ESC.">
  <meta name="theme-color" content="#f5f2eb">
  <!-- 카톡·SNS 공유 미리보기. 주소(도메인)가 바뀌면 og:url / og:image 도 같이 바꾸기 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="온라인 헬스장">
  <meta property="og:title" content="온라인 헬스장 — 일하는 척 하체 하는 곳">
  <meta property="og:description" content="회사 문장 따라 치면 바벨이 올라감. 옆에서 보면 그냥 일하는 중.">
  <meta property="og:url" content="https://online-gym.jch200325.workers.dev/">
  <meta property="og:image" content="https://online-gym.jch200325.workers.dev/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- 애드센스 신청할 때 받은 코드: <meta name="google-adsense-account" content="ca-pub-..."> 를 여기에 -->
  <link rel="icon" id="favicon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>온라인 헬스장</h1>
      <div class="top-right">
        <span id="net" class="net">연결 중</span>
        <button id="btn-sound" class="link" type="button">소리 켜기</button>
        <button id="btn-boss" class="link" type="button">위장 <kbd>ESC</kbd></button>
      </div>
    </header>

    <div class="layout">
    <main class="center">
    <div id="stage" class="stage" data-state="rack">
      <div class="wall" aria-hidden="true">
        <div class="board">
          <b>공지</b>
          <ul id="notes"></ul>
        </div>
        <svg class="clock" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="18" fill="#fff" stroke="#2b2722" stroke-width="2.5"/>
          <g stroke="#2b2722" stroke-width="1.4" stroke-linecap="round">
            <path d="M20 4.5v3M20 32.5v3M4.5 20h3M32.5 20h3"/>
          </g>
          <line id="clock-h" x1="20" y1="20" x2="20" y2="11" stroke="#2b2722" stroke-width="2.4" stroke-linecap="round"/>
          <line id="clock-m" x1="20" y1="20" x2="20" y2="7" stroke="#2b2722" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="20" cy="20" r="1.6" fill="#d9432c"/>
        </svg>
      </div>
      <svg id="lifter" role="img" aria-label="스쿼트하는 사람"></svg>
      <div class="prog" aria-hidden="true"><div class="prog-stick"></div><div id="prog-fill" class="prog-fill"></div></div>
      <div class="timer" aria-hidden="true"><div id="time-fill"></div></div>
      <div id="say" class="say"></div>
      <div id="fx" class="fx" aria-hidden="true"></div>
      <div id="bubbles" class="bubbles" aria-live="polite"></div>
    </div>

    <div id="typing" class="typing">
      <div class="type-head">
        <span id="type-count">첫 문장</span>
        <span id="type-meta" class="type-meta"></span>
      </div>
      <p id="type-target" class="type-target idle"></p>
      <div id="type-slot" class="type-slot">
        <input id="type-input" class="type-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" placeholder="여기에 따라 치세요" aria-label="따라 칠 문장 입력">
      </div>
    </div>

    <div class="controls">
      <div class="ex-tabs" role="group" aria-label="운동">
        <button type="button" data-ex="squat" class="on">스쿼트</button>
        <button type="button" data-ex="deadlift">데드리프트</button>
        <button type="button" data-ex="bench">벤치프레스</button>
      </div>
      <div class="weight" role="group" aria-label="무게">
        <button type="button" class="wbtn" data-dw="-10">−10</button>
        <button type="button" class="wbtn" data-dw="-5">−5</button>
        <div class="w"><b id="w-now">40</b>kg</div>
        <button type="button" class="wbtn" data-dw="5">+5</button>
        <button type="button" class="wbtn" data-dw="10">+10</button>
      </div>
    </div>
    <p class="need">
      <span id="need"></span>
      <span class="sep">·</span>
      <label>성공하면
        <select id="auto-inc">
          <option value="0">그대로</option>
          <option value="2.5">+2.5kg</option>
          <option value="5">+5kg</option>
          <option value="10">+10kg</option>
        </select>
      </label>
    </p>
    <p class="howto">
      위 문장을 그대로 따라 치세요. 한 문장 끝낼 때마다 한 칸씩 올라가고, 시간 안에 다 치면 성공이에요.<br>
      마침표까지 치면 자동으로 넘어가고 Enter로 넘겨도 돼요. 부장님 오면 <kbd>ESC</kbd> — 문서에 그대로 쳐져요.
    </p>
    </main>

      <aside class="side side-left">
        <h2>헬스장 <small id="feed-note"></small></h2>
        <ul id="feed" class="feed"></ul>
        <div id="shouts" class="shouts"></div>
        <div class="ad-slot" data-slot="side" hidden></div>
      </aside>

      <aside class="side side-right">
        <h2>
          <span id="rank-title">순위</span>
          <span id="tabs" class="tabs">
            <button type="button" data-tab="today" class="on">오늘</button>
            <button type="button" data-tab="fame">역대</button>
          </span>
        </h2>
        <ol id="rank" class="rank"></ol>
        <p id="total" class="total"></p>

        <h2 class="mt">내 기록</h2>
        <p class="me"><span id="me-name"></span> <button id="btn-reroll" class="link" type="button">닉네임 바꾸기</button></p>
        <p id="me-stats" class="me-stats"></p>
      </aside>
    </div>

    <div class="ad-slot ad-bottom" data-slot="bottom" hidden></div>

    <footer>
      <nav class="foot-links"><a href="guide.html">하는 법</a> · <a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a></nav>
      기록은 이 브라우저에만 저장돼요. 손목 아프면 쉬세요.
    </footer>
  </div>

  <div id="boss" class="boss" hidden></div>

  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="sfx.js"></script>
  <script src="figure.js"></script>
  <script src="boss.js"></script>
  <script src="net.js"></script>
  <script src="app.js"></script>
  <script src="ads.js"></script>
</body>
</html>
